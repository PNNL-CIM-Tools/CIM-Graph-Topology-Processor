[project]
name = "cim-topology"
version = "0.0.1a0"
description = "Topology Processor based on CIM-Graph Library"
authors = [
    {name = "A. Anderson", email = "19935503+AAndersn@users.noreply.github.com"}
]
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10,<4.0"
keywords = ["CIM", "topology", "power-systems", "grid", "GridAPPS-D", "transmission", "distribution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cim-graph>=0.4.3a0",
]

[project.urls]
Homepage = "https://github.com/PNNL-CIM-Tools/CIM-Graph-Topology-Processor"
Repository = "https://github.com/PNNL-CIM-Tools/CIM-Graph-Topology-Processor"
Issues = "https://github.com/PNNL-CIM-Tools/CIM-Graph-Topology-Processor/issues"

[project.optional-dependencies]
gridappsd = ["gridappsd-python"]
dev = [
    "pre-commit>=2.17.0",
    "ipykernel>=6.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cimtopology"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.debug",
    "/.vscode",
    "/.git",
    "/.venv",
    "/AGENTS.md",
    "/CLAUDE.md",
    "*.ipynb",
]