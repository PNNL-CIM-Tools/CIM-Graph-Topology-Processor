[project]
name = "cim-topology"
version = "0.1.0"
description = "Topology Processor based on CIM-Graph Library"
authors = [
    {name = "A. Anderson", email = "19935503+AAndersn@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    # pre-1.0: pin below the next minor
    "cim-graph>=0.6.0a0,<0.7",
    "cim-profiles>=0.1.0a4,<0.2",
]

[project.optional-dependencies]
gridappsd = ["gridappsd-python"]

# Not shipped to PyPI users; `uv sync` / `uv run` install it by default.
[dependency-groups]
dev = [
    "pre-commit>=2.17.0",
    "ipykernel>=6.25.1",
    "pytest>=8.3.5",
    # test-only: builds the cim18v17 test fixtures from CIMTBL-Models .cimtbl files
    "cimtables>=0.1.0a1",
]

[tool.uv]
# cim-graph and its deps (gridappsd-python) are pre-release builds
prerelease = "allow"

# Local development against sibling checkouts.
[tool.uv.sources]
cim-graph = { path = "../CIM-Graph", editable = true }
cim-profiles = { path = "../CIM-Profiles", editable = true }
cimtables = { path = "../CIM-Tables", editable = true }

[tool.pytest.ini_options]
testpaths = ["test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cimtopology"]
