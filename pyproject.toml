[tool.poetry]
name = "cim-topology"
version = "v0.0.1a"
description = "Topology Processor based on CIM-Graph Library"
authors = ["A. Anderson <19935503+AAndersn@users.noreply.github.com>"]
packages = [
    { include = "cimtopology" }
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
#cim-builer = "^0.1.0a0"
#cim-loader = "^0.1.0a0"
cim-graph = "^0.4.3a0"

[tool.poetry.extras]
gridappsd = ["gridappsd-python"]

[tool.poetry.group.dev.dependencies]
pre-commit = "^2.17.0"
ipykernel = "^6.25.1"


[build-system]
requires = ["poetry-core>=1.2.0"]
build-backend = "poetry.core.masonry.api"