[project]
name = "cim-topology"
version = "0.0.1a0"
description = "Topology Processor based on CIM-Graph Library"
authors = [
    {name = "A. Anderson", email = "19935503+AAndersn@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "cim-graph>=0.4.3a0",
]

[project.optional-dependencies]
gridappsd = ["gridappsd-python"]
dev = [
    "pre-commit>=2.17.0",
    "ipykernel>=6.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cimtopology"]